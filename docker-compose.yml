version: "3.8"

services:
  groundtrace-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      - PORT=8001
    restart: unless-stopped

  groundtrace-ui:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "3001:3000"
    command: sh -c "npm install && npm run dev"
    depends_on:
      - groundtrace-api
